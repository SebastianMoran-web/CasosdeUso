<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">

    <span class="navbar-brand" >GameArena · Panel del administrador</span>
    <span id="conexión" class="badge text-bg-secondary">Sin conectar</span>

</nav>
    

<div class="container my-3">

    <div id="aviso" role="alert"></div>

    <ul class="nav nav-tabs mb-3">

        <li class="nav-item"><button type="button" class=nav-link>Torneos</button></li>
        <li class="nav-item"><button type="button" class=nav-link>Jugadores</button></li>
        <li class="nav-item"><button type="button" class=nav-link>Videojuegos</button></li>

    </ul>

    <main>

        <div id="tabJugadores">

            <div class="card mb-3">
                <div class="card-header fw-bold">Jugadores</div>
                <div class="card-body">

                   <div class="d-flex justify-content-end align-items-end mb-2">

                        <label for="buscarJugadorId" class="form-label">Buscar por ID</label>
                        <input type="number" id="buscarJugadorId" class="form-control">

                        <button type="button" id="btnBuscarJugador" class="btn btn-outline-primary">Buscar</button>

                   </div> 

                </div>

                <!-- GET /jugadores/{id}: se mostrara al jugador que tenga la ID dada-->

                <div id="resJugador" class="mb-3"></div>

                <table class="table">
                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Nick</th>
                            <th>Email</th>
                            <th>Nivel</th> 
                            <th>Acciones</th>                     

                        </tr>

                    </thead>

                    <tbody id="cuerpoJugadores">

                        <!-- GET/jugadores: aqui se pintaran los jugadores -->
                        <!--cada fila lleva 3 botones (a la derecha): Torneos, Editar y Eliminar -->
                        <!-- PUT/jugadores/{id}: boton Editar de cada fila, rellena el formulario y se guarda desde alli -->
                        <!-- DELETE/jugadores/{id}: boton de Eliminar de cada fila -->

                        


                    </tbody>
                </table>

            </div>

        

        <div class="row g-3">

            <div class="col-md-6">

                <div class="card">

                    <div class="card-header fw-bold">Jugador</div>
                    <div class="card-body">

                        <!-- Post/jugadores: crear un jugador con este formulario -->
                        <!-- El PUT ya fue escrito antes en la tabla-->

                        <form id="formJugador">

                            <div class="mb-3">

                                <label for="jNick" class="form-label">Nick</label>
                                <input type="text" id="jNick" class="form-control">

                            </div>

                            <div class="mb-3">

                                <label for="jEmail" class="form-label">Email</label>
                                <input type="text" id="jEmail" class="form-control">

                            </div>

                            <div class="mb-3">

                                <label for="jNivel" class="form-label">Nivel</label>
                                <input type="text" id="jNivel" class="form-control">

                            <button type="submit" id= "btnJugador" class="btn btn-success">Crear Jugador</button>
                                

                            </div>

                        </form>

                    </div>

                </div>

            </div>

            <div id="panelTorneosJugador" class="col-md-6" hidden>
                <div class="card">
                    <div class="card-header">
                        <h2 id="tituloTorneosJugador" class="h6 mb-0">Torneos del Jugador</h2>


                    </div>
                    <div class="card-body">

                        <!-- GET/jugadores/{id}/participaciones: aqui se pintaran los torneos del jugador  -->

                        <ul id="listaTorneosJugador" class="list-group"> </ul>

                    </div>
                </div>
            </div>
        </div>
         </div>

        <div id="tabTorneos" hidden>

            <div class="card mb-3">

                <div class="card-header fw-bold">Torneos</div>
                    <div class="card-body">

                        <div class="row g-2 align-items-end mb-3">

                            <div class="col-md-4">
                                <label for="filtroEstado" class="form-label">Filtrar por estado</label>
                                <select id="filtroEstado" class="form-select">

                                    <option value=""></option>
                                    <option value="ABIERTO"></option>
                                    <option value="EN_CURSO"></option>
                                    <option value="FINALIZADO"></option>                                    

                                </select>

                            </div>

                            <div class="col-md-4">

                                <label for="filtroVideojuego" class="form-label">Filtrar por videojuego</label>

                                <select id="filtroVideojuego" class="form-select">
                                    <option value=""></option>
                                </select>
                            </div>
                            <div class="col-md-4">

                                <!-- GET/torneos?estado=...&videojuegoId=...: filtrar por estado, por videojuego o por ambos-->

                                <button type="button" id="btnFiltrarTorneo" class="btn btn-outline-primary">Filtrar</button>
                            </div>

                        </div>
                            
                        <div class="d-flex justify-content-end align-items-end gap-2 mb-2">
                        <div>
                            <label for="buscarTorneoId" class="form-label">Buscar por ID</label>
                            <input type="number" id="buscarTorneoId" class="form-control">
                        </div>
                        <button type="button" id="btnBuscarTorneo" class="btn btn-outline-primary">Buscar</button>
                    </div>
                    <!-- GET /torneos/{id}: aquí se pintará un torneo por ID -->
                    <div id="resTorneo" class="mb-3"></div>
 
                    <table class="table table-sm">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Videojuego</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTorneos">
                            <!-- GET /torneos: aquí se pintarán los torneos -->
                            <!-- cada fila lleva 3 botones (a la derecha): Jugadores, Editar y Eliminar -->
                            <!-- DELETE /torneos/{id}: botón Eliminar de cada fila -->
                        </tbody>
                    </table>
                </div>



            </div>

        
           <div class="row g-3 mb-3">
 
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header fw-bold">Torneo</div>
                        <div class="card-body">
                            <!-- POST /torneos: crear un torneo nuevo con este formulario -->
                            <!-- PUT /torneos/{id}: Editar rellena el formulario y este mismo botón guarda los cambios -->
                            <form id="formTorneo">
                                <div class="mb-3">
                                    <label for="tNombre" class="form-label">Nombre</label>
                                    <input type="text" id="tNombre" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label for="tVideojuego" class="form-label">Videojuego</label>
                                    <select id="tVideojuego" class="form-select" required>
                                        <option value=""></option>
                                        <!-- GET /videojuegos: aquí se pintarán las opciones del selector de videojuego -->
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="tEstado" class="form-label">Estado</label>
                                    <select id="tEstado" class="form-select">
                                        <option value="ABIERTO">ABIERTO</option>
                                        <option value="EN_CURSO">EN_CURSO</option>
                                        <option value="FINALIZADO">FINALIZADO</option>
                                    </select>
                                </div>
                                <button type="submit" id="btnTorneo" class="btn btn-success w-100">Crear torneo</button>
                            </form>
                        </div>
                    </div>
                </div>
 
                <div id="panelJugadoresTorneo" class="col-md-6" hidden>
                    <div class="card">
                        <div class="card-header">
                            <h2 id="tituloJugadoresTorneo" class="h6 mb-0">Jugadores del torneo</h2>
                        </div>
                        <div class="card-body">
                            <!-- GET /torneos/{id}/participaciones: una línea por jugador -->
                            <ul id="listaJugadoresTorneo" class="list-group"></ul>
                        </div>
                    </div>
                </div>
 
            </div>
 
            <div class="card">
                <div class="card-header fw-bold">Inscribir jugador en torneo</div>
                <div class="card-body">
                    <!-- POST /participaciones: inscribir al jugador elegido en el torneo elegido -->
                    <form id="formInscripcion" class="row g-2 align-items-end">
                        <div class="col-md-4">
                            <label for="iTorneo" class="form-label">Torneo</label>
                            <select id="iTorneo" class="form-select">
                                <option value=""></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="iJugador" class="form-label">Jugador</label>
                            <select id="iJugador" class="form-select">
                                <option value=""></option>
                                <!-- GET /jugadores: aquí se pintarán las opciones del selector de jugador -->
                            </select>
                        </div>
                        <div class="col-md-4">
                            <button type="submit" id="btnInscribir" class="btn btn-success w-100">Inscribir jugador</button>
                        </div>
                    </form>
                </div>
            </div>
 
        </div>
 
        <div id="tabVideojuegos" hidden>
 
            <div class="card mb-3">
                <div class="card-header fw-bold">Videojuegos</div>
                <div class="card-body">
 
                    <div class="d-flex justify-content-end align-items-end gap-2 mb-2">
                        <div>
                            <label for="buscarVideojuegoId" class="form-label">Buscar por ID</label>
                            <input type="number" id="buscarVideojuegoId" class="form-control">
                        </div>
                        <button type="button" id="btnBuscarVideojuego" class="btn btn-outline-primary">Buscar</button>
                    </div>
                    <!-- GET /videojuegos/{id}: aquí se pintará un videojuego por ID -->
                    <div id="resVideojuego" class="mb-3"></div>
 
                    <table class="table table-sm">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Género</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoVideojuegos">
                            <!-- GET /videojuegos: aquí se pintarán los videojuegos -->
                        </tbody>
                    </table>
 
                </div>
            </div>
 
            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header fw-bold">Videojuego</div>
                        <div class="card-body">
                            <!-- POST /videojuegos: crear un videojuego nuevo con este formulario -->
                            <form id="formJuego">
                                <div class="mb-3">
                                    <label for="vjNombre" class="form-label">Nombre</label>
                                    <input type="text" id="vjNombre" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label for="vjGenero" class="form-label">Género</label>
                                    <input type="text" id="vjGenero" class="form-control">
                                </div>
                                <button type="submit" id="btnJuego" class="btn btn-success w-100">Crear videojuego</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
 
        </div>

    </main>

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
